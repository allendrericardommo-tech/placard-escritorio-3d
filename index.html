<title>Placard con escritorio 3D</title>

<style>
html,body{margin:0}
*,*::before,*::after{box-sizing:border-box}

/* Layout: showroom oscuro — escena 3D a la izquierda (arriba en el teléfono), ficha de la propuesta a la derecha (abajo). Un solo look oscuro, como la presentación. */
:root{
  --bg:#141311;          /* fondo de la página */
  --panel:#1d1c19;       /* ficha y barras */
  --line:#34312b;        /* divisores */
  --fg:#f3f0ea;          /* texto principal */
  --muted:#a9a399;       /* texto secundario */
  --accent:#f0cf1c;      /* amarillo del logo */
  --oak:#d98b54;         /* roble, para detalles */
  --plug:#ff8a3d;        /* enchufe */
  --display:'Josefin Sans', 'Avenir Next', 'Segoe UI', sans-serif;
  --body:'Manrope', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100%;min-height:560px}
header{grid-column:1 / -1;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--bg)}
header img{width:40px;height:40px;border-radius:6px;flex:none}
header .t{display:flex;flex-direction:column;min-width:0}
header h1{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
header .obra{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.tabs{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:3}
.tabs button{width:46px;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(20,19,17,.72);color:var(--fg);font-family:var(--display);font-size:22px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#141311;border-color:var(--accent)}
.views{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:3}
.chip{border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(20,19,17,.72);color:var(--fg);font:600 13px/1 var(--body);padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.4)}
.toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:3;padding:6px;border-radius:16px;background:rgba(20,19,17,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);max-width:calc(100% - 24px);overflow-x:auto}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:8px 10px;border-radius:11px;border:0;background:transparent;color:var(--muted);font:700 12px/1.1 var(--body);cursor:pointer}
.tg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tg[aria-pressed="true"]{background:rgba(240,207,28,.14);color:var(--accent)}
.tg:hover{color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:14px;bottom:92px;font-size:12px;color:var(--muted);z-index:2;pointer-events:none;text-shadow:0 1px 2px #000}
.lbl{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font:800 13px/1 var(--body);font-variant-numeric:tabular-nums;color:#141311;background:var(--accent);padding:4px 7px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-50%)}
.lbl.plug{background:var(--plug);color:#141311}
.lbl[hidden]{display:none}
aside.info{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:22px 22px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oak);font-weight:800}
.info h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.info p.lead{margin:0;color:var(--muted)}
.dims{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-variant-numeric:tabular-nums}
.dims dt{color:var(--muted)}
.dims dd{margin:0;font-weight:700}
.info h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--fg)}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pros li::marker{color:var(--accent)}
.cons li::marker{color:var(--plug)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 64vh auto;height:auto}
  .stage{min-height:380px}
  aside.info{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .tg{min-width:62px;padding:7px 6px;font-size:11px}
  .views{top:70px;left:14px;right:auto}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .chip,.tg{transition:none} }
</style>
</head>

function start(){
const renderer = new THREE.WebGLRenderer({antialias:true});

/* ---------- materiales ---------- */
const loader = new THREE.TextureLoader();
function tx(src, rot){ const t = loader.load(src); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; if(rot){ t.center.set(.5,.5); t.rotation = rot; } return t; }
const M = {
  white: new THREE.MeshStandardMaterial({color:'#ebe9e4', roughness:.55}),
  woodV: new THREE.MeshStandardMaterial({color:'#ffd6b8', map:tx(TEX.wood), roughness:.45}),
  woodH: new THREE.MeshStandardMaterial({color:'#ffd6b8', map:tx(TEX.wood, Math.PI/2), roughness:.45}),
  steel: new THREE.MeshStandardMaterial({color:'#cfd2d6', metalness:.85, roughness:.3}),
  led:   new THREE.MeshStandardMaterial({color:'#fff3df', emissive:new THREE.Color('#ffd08a'), emissiveIntensity:2.2}),
  wall:  new THREE.MeshStandardMaterial({color:'#e3e1dc', roughness:.9}),
  clad:  new THREE.MeshStandardMaterial({color:'#ffffff', map:tx(TEX.clad), roughness:.75}),
  floor: new THREE.MeshStandardMaterial({color:'#ffffff', map:tx(TEX.floor), roughness:.6}),
  dark:  new THREE.MeshStandardMaterial({color:'#2a2c31', roughness:.85}),
  plate: new THREE.MeshStandardMaterial({color:'#f7f6f2', roughness:.35}),
  hole:  new THREE.MeshBasicMaterial({color:'#222'}),
  glass: new THREE.MeshBasicMaterial({color:'#cfe3f5'}),
  ring:  new THREE.MeshBasicMaterial({color:'#ff8a3d', transparent:true, opacity:.9, depthTest:false})
};
const TILE = {woodV:90, woodH:90, clad:120, floor:80};

/* caja con UV en escala real (cm) para que las texturas no se estiren */
function boxGeo(w, h, d, tile){
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile){
    const uv = g.attributes.uv, fs = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for (let f=0; f<6; f++) for (let i=0; i<4; i++){ const k=f*4+i; uv.setXY(k, uv.getX(k)*fs[f][0]/tile, uv.getY(k)*fs[f][1]/tile); }
  }
  return g;
}
/* datos en cm: a=[u,d,z] → three: x=u, y=z (altura), z=d (profundidad) */
function mesh(a, b, matKey, shadow=true){
  const w=b[0]-a[0], h=b[2]-a[2], d=b[1]-a[1];
  const m = new THREE.Mesh(boxGeo(w,h,d, TILE[matKey]), M[matKey]);
  m.position.set((a[0]+b[0])/2, (a[2]+b[2])/2, (a[1]+b[1])/2);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function wallBox(x0,x1,y0,y1,z0,z1,mat){ return mesh([x0,z0,y0],[x1,z1,y1], mat||'wall'); }

// pared de la puerta (x=0): vano entre 71 y 158, alto 200
room.add(wallBox(-10,0,0,HC,0,71)); room.add(wallBox(-10,0,0,HC,158,DEPTH)); room.add(wallBox(-10,0,200,HC,71,158));
room.add(mesh([-7,71,0],[-3,158,198],'woodV'));                          // hoja de la puerta
[[71,74],[155,158]].forEach(([z0,z1])=>room.add(mesh([-1,z0,0],[1.5,z1,203],'white')));
room.add(mesh([-1,71,200],[1.5,158,203],'white'));
// pared de la ventana (x=W): vano entre 121 y 321, de 50 a 200
room.add(wallBox(W,W+10,0,HC,0,121)); room.add(wallBox(W,W+10,0,HC,321,DEPTH));
room.add(wallBox(W,W+10,0,50,121,321)); room.add(wallBox(W,W+10,200,HC,121,321));
const glass = new THREE.Mesh(new THREE.PlaneGeometry(200,150), M.glass); glass.position.set(W+6, 125, 221); glass.rotation.y = -Math.PI/2; room.add(glass);
[[121,125],[219,223],[317,321]].forEach(([z0,z1])=>room.add(mesh([W-1,z0,50],[W+7,z1,200],'white')));
room.add(mesh([W-1,121,46],[W+9,321,50],'white')); room.add(mesh([W-1,121,196],[W+7,321,200],'white'));
// enchufe
const ring = new THREE.Mesh(new THREE.RingGeometry(9,10.5,48), M.ring); ring.renderOrder = 5; room.add(ring);
let curS = [SU, SZ];

/* ---------- luces ---------- */
const hemi = new THREE.HemisphereLight('#f4f6ff', '#8a7a66', .55); scene.add(hemi);
const amb = new THREE.AmbientLight('#ffffff', .18); scene.add(amb);
const sun = new THREE.DirectionalLight('#fff1dc', 1.1);
sun.position.set(W+420, 330, 300); sun.target.position.set(W/2, 0, 80); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
Object.assign(sun.shadow.camera, {left:-360,right:360,top:360,bottom:-360,near:50,far:1500});
const fill = new THREE.DirectionalLight('#ffffff', .35); fill.position.set(W/2, 260, 700); scene.add(fill);
const lamp = new THREE.PointLight('#ffe2b8', 0, 900, 2); lamp.position.set(W/2, 250, 230); scene.add(lamp);

/* ---------- mueble ---------- */
let furn = null, anims = [], ledLights = [], dimObjs = [], code = 'A', isOpen = false, chair = null;
const labelsEl = document.getElementById('labels');
let labels = [];

function inside(h, p){ return h.a[0] >= p.a[0]-0.5 && h.b[0] <= p.b[0]+0.5 && h.a[2] >= p.a[2]-0.5 && h.b[2] <= p.b[2]+0.5; }

function build(c){
  code = c;
  if (furn){ scene.remove(furn); furn.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  ledLights.forEach(l=>scene.remove(l)); ledLights = []; anims = []; chair = null;
  furn = new THREE.Group(); scene.add(furn);
  const parts = DATA.P[c];
  curS = (DATA.sock && DATA.sock[c]) || [SU, SZ];
  const [su, sz] = curS;
  furn.add(mesh([su-4,0,sz-6],[su+4,1,sz+6],'plate',false));
  [[-1.6,-0.9],[0.9,1.6]].forEach(([u0,u1])=>furn.add(mesh([su+u0,0.95,sz+1],[su+u1,1.1,sz+3],'hole',false)));
  ring.position.set(su, sz, 2);
  const movers = parts.filter(p=>p.k==='door'||p.k==='drawer'||p.k==='slider');
  const groups = new Map();
  movers.forEach(p=>{
    const g = new THREE.Group(); furn.add(g);
    if (p.k === 'door'){
      const hx = p.h === 'L' ? p.a[0] : p.b[0];
      g.position.set(hx, 0, p.b[1]);
      const m = mesh(p.a, p.b, (p.b[0]-p.a[0]) > (p.b[2]-p.a[2]) ? 'woodH' : 'woodV'); m.position.x -= hx; m.position.z -= p.b[1]; g.add(m);
      anims.push({g, type:'door', sign: p.h==='L' ? -1 : 1, t:0, target:0});
    } else if (p.k === 'drawer'){
      g.add(mesh(p.a, p.b, 'woodH'));
      const box = mesh([p.a[0]+2, p.a[1]-44, p.a[2]+2], [p.b[0]-2, p.a[1], p.b[2]-5], 'white'); g.add(box);
      anims.push({g, type:'drawer', t:0, target:0});
    } else {
      g.add(mesh(p.a, p.b, 'woodV'));
      const dx = p.s > 0 ? (W - 1.8 - (p.b[0]-p.a[0])) - p.a[0] : p.s < 0 ? 1.8 - p.a[0] : 0;
      anims.push({g, type:'slider', dx, t:0, target:0});
    }
    groups.set(p, g);
  });
  parts.forEach(p=>{
    if (movers.includes(p)) return;
    if (p.k === 'handle'){
      const owner = movers.find(o=>inside(p,o));
      const m = mesh(p.a, p.b, 'steel');
      if (owner){ const g = groups.get(owner); m.position.sub(g.position); g.add(m); } else furn.add(m);
      return;
    }
    let mk = p.m === 'wood' ? (((p.b[0]-p.a[0]) >= (p.b[2]-p.a[2])) ? 'woodH' : 'woodV') : p.m;
    if (p.k === 'led') mk = 'led';
    const m = mesh(p.a, p.b, mk, p.k !== 'led'); furn.add(m);
    if (p.k === 'led'){
      const len = p.b[0]-p.a[0];
      const rl = new THREE.RectAreaLight('#ffc27a', 0, len, 5);
      rl.position.set((p.a[0]+p.b[0])/2, p.a[2]-0.4, (p.a[1]+p.b[1])/2);
      rl.lookAt(rl.position.x, 0, rl.position.z);
      scene.add(rl); ledLights.push(rl);
    }
  });
  // sólo los lados de las corredizas llevan tirador: ya vienen en el modelo como piezas "slider"; se agregan tiradores verticales
  parts.filter(p=>p.k==='slider').forEach(p=>{
    const g = groups.get(p), front = p.a[1] > 58, x = (front || p.a[0] > 100) ? p.a[0]+3 : p.b[0]-4.2;
    const m = mesh([x, p.b[1], 95], [x+1.2, p.b[1]+2.5, 145], 'steel'); m.position.sub(g.position); g.add(m);
  });
  // escritorio: laptop y silla para dar escala
  const desk = parts.find(p=>p.k==='desk');
  if (desk){
    const du0 = desk.a[0], du1 = desk.b[0], dz = desk.b[2], ddp = desk.b[1];
    const lc = c === 'D' ? 168 : (du0+du1)/2 - 10;
    furn.add(mesh([lc-16, 12, dz], [lc+16, 34, dz+1.5], 'steel'));
    const scr = mesh([lc-16, 10, dz+1.5], [lc+16, 11.2, dz+22], 'steel'); furn.add(scr);
    const cx = c === 'D' ? 190 : (du0+du1)/2 + 5, cy = ddp + 10;
    chair = new THREE.Group(); furn.add(chair);
    chair.add(mesh([cx-22, cy-22, 44], [cx+22, cy+20, 50], 'dark'));
    chair.add(mesh([cx-21, cy+18, 50], [cx+21, cy+22, 92], 'dark'));
    [[-19,-19],[19,-19],[-19,18],[19,18]].forEach(([ax,ay])=>chair.add(mesh([cx+ax-1, cy+ay-1, 0], [cx+ax+1, cy+ay+1, 44], 'steel')));
    chair.userData.out = c === 'D' ? (86 - cy) : 0;   // en la D, con el placard cerrado la silla queda afuera
  }
  buildDims(parts);
  setOpen(isOpen, true);
  applyLed(); renderInfo();
}

/* ---------- cotas ---------- */
function buildDims(parts){
  dimObjs.forEach(o=>scene.remove(o)); dimObjs = [];
  labels.forEach(l=>l.el.remove()); labels = [];
  const mat = new THREE.LineBasicMaterial({color:'#f0cf1c', depthTest:false, transparent:true});
  function dim(p1, p2, txt, tick){
    const pts = [p1, p2], g = new THREE.Group();
    const v = new THREE.Vector3().subVectors(p2,p1).normalize();
    const perp = Math.abs(v.y) > .5 ? new THREE.Vector3(tick,0,0) : new THREE.Vector3(0,tick,0);
    [p1,p2].forEach(p=>pts.push(p.clone().sub(perp), p.clone().add(perp)));
    const geo = new THREE.BufferGeometry().setFromPoints([p1,p2,pts[2],pts[3],pts[4],pts[5]]);
    const ln = new THREE.LineSegments(geo, mat); ln.renderOrder = 6; g.add(ln);
    scene.add(g); dimObjs.push(g);
    addLabel(new THREE.Vector3().addVectors(p1,p2).multiplyScalar(.5), txt);
  }
  const left = parts.find(p=>p.n.startsWith('Lateral izq.')) || parts[0];
  const top = Math.max(...parts.map(p=>p.b[2]));
  const front = Math.max(...parts.filter(p=>p.k!=='handle').map(p=>p.b[1]));
  dim(new THREE.Vector3(0, top+12, front), new THREE.Vector3(W, top+12, front), '251,5', 4);
  dim(new THREE.Vector3(-4, 0, front+4), new THREE.Vector3(-4, left.b[2], front+4), fmt(left.b[2]), 4);
  const desk = parts.find(p=>p.k==='desk');
  if (desk){
    dim(new THREE.Vector3(desk.a[0], desk.b[2]+6, desk.b[1]+3), new THREE.Vector3(desk.b[0], desk.b[2]+6, desk.b[1]+3), fmt(desk.b[0]-desk.a[0]), 3);
    dim(new THREE.Vector3(desk.b[0]-6, 0, desk.b[1]+3), new THREE.Vector3(desk.b[0]-6, desk.b[2], desk.b[1]+3), fmt(desk.b[2]), 3);
  }
  addLabel(new THREE.Vector3(curS[0], curS[1]+17, 3), 'Enchufe · 130 cm', 'plug');
}
function addLabel(pos, txt, cls){
  const el = document.createElement('div'); el.className = 'lbl' + (cls ? ' '+cls : ''); el.textContent = txt; labelsEl.appendChild(el);
  labels.push({el, pos});
}
const _v = new THREE.Vector3();
function placeLabels(){
  const show = dimsOn, w = stage.clientWidth, h = stage.clientHeight;
  labels.forEach(l=>{
    _v.copy(l.pos).project(camera);
    const vis = show && _v.z < 1 && Math.abs(_v.x) < 1.05 && Math.abs(_v.y) < 1.05;
    l.el.hidden = !vis;
    if (vis) l.el.style.transform = `translate(${(_v.x*.5+.5)*w}px, ${(-_v.y*.5+.5)*h}px) translate(-50%,-50%)`;
  });
  dimObjs.forEach(o=>o.visible = show); ring.visible = show;
}

/* ---------- animación de puertas y cajones ---------- */
function setOpen(v, instant){
  isOpen = v; anims.forEach(a=>{ a.target = v?1:0; if(instant) a.t = a.target; });
  if (chair){ chair.userData.t = instant ? (v?1:0) : (chair.userData.t ?? 0); chair.userData.target = v?1:0; }
  const b = document.getElementById('tOpen'); b.setAttribute('aria-pressed', v); b.lastChild.textContent = v ? 'Cerrar' : 'Abrir';
}
const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function stepAnims(dt){
  const sp = reduce ? 99 : dt/0.9;
  anims.forEach(a=>{
    if (a.t !== a.target) a.t = a.target > a.t ? Math.min(a.target, a.t+sp) : Math.max(a.target, a.t-sp);
    const e = ease(a.t);
    if (a.type === 'door') a.g.rotation.y = a.sign * e * 1.75;
    else if (a.type === 'drawer') a.g.position.z = e * 34;
    else a.g.position.x = e * a.dx;
  });
  if (chair && chair.userData.out){
    const u = chair.userData; if (u.t !== u.target) u.t = u.target > u.t ? Math.min(u.target, u.t+sp) : Math.max(u.target, u.t-sp);
    chair.position.z = (1 - ease(u.t)) * u.out;
  }
}

/* ---------- luz, día y noche ---------- */
let ledOn = true, night = false, dimsOn = true;
function applyLed(){
  M.led.emissiveIntensity = ledOn ? (night ? 4 : 3) : 0;
  M.led.color.set(ledOn ? '#fff3df' : '#bdbab3');
  ledLights.forEach(l=>l.intensity = ledOn ? (night ? 22 : 12) : 0);
}
function applyNight(){
  hemi.intensity = night ? .035 : .55; amb.intensity = night ? .02 : .18;
  sun.intensity = night ? 0 : 1.1; fill.intensity = night ? .03 : .35;
  lamp.intensity = night ? .18 : 0;
  M.glass.color.set(night ? '#1b2740' : '#cfe3f5');
  renderer.toneMappingExposure = night ? 1.25 : 1.05;
  applyLed();
}

/* ---------- vistas ---------- */
const VIEWS = { frente:[[W/2,150,560],[W/2,115,40]], frenteM:[[W/2,140,455],[W/2,118,40]], lateral:[[W+40,175,400],[W*0.42,110,30]], arriba:[[W/2,620,330],[W/2,60,60]] };
let camAnim = null;
function goView(k, instant){
  if (k === 'frente' && stage.clientWidth < 600) k = 'frenteM';
  const [p,t] = VIEWS[k]; const from = {p:camera.position.clone(), t:controls.target.clone()};
  if (instant || reduce){ camera.position.set(...p); controls.target.set(...t); return; }
  camAnim = {from, to:{p:new THREE.Vector3(...p), t:new THREE.Vector3(...t)}, k:0};
}

/* ---------- ficha ---------- */
function renderInfo(){
  const d = INFO[code];
  document.getElementById('info').innerHTML =
    `<div><div class="eyebrow">Propuesta ${code}</div><h2>${d.name}</h2></div>
     <p class="lead">${d.lead}</p>
     <dl class="dims">${d.dims.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
     <div class="pros"><h3>Ventajas</h3><ul>${d.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div>
     <div class="cons"><h3>A considerar</h3><ul>${d.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>
     <p class="note">Medidas en cm. Pared revestida de 251,5 y cielorraso a 260. En todas las propuestas el enchufe (a 130 cm) queda libre; en la A se corre para quedar centrado sobre el escritorio.</p>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.code===code));
}
const tabs = document.getElementById('tabs');
['A','B','C','D'].forEach(c=>{
  const b = document.createElement('button'); b.textContent = c; b.dataset.code = c; b.setAttribute('role','tab');
  b.title = 'Propuesta ' + c + ': ' + INFO[c].name;
  b.onclick = ()=>{ if (location.hash !== '#'+c.toLowerCase()) location.hash = c.toLowerCase(); else build(c); };
  tabs.appendChild(b);
});
function fromHash(){ const h = (location.hash||'').replace('#','').toUpperCase(); return INFO[h] ? h : 'A'; }
window.addEventListener('hashchange', ()=>build(fromHash()));

document.getElementById('tOpen').onclick = ()=>setOpen(!isOpen);
document.getElementById('tLed').onclick = e=>{ ledOn = !ledOn; e.currentTarget.setAttribute('aria-pressed', ledOn); applyLed(); };
document.getElementById('tNight').onclick = e=>{ night = !night; e.currentTarget.setAttribute('aria-pressed', night); applyNight(); };
document.getElementById('tDims').onclick = e=>{ dimsOn = !dimsOn; e.currentTarget.setAttribute('aria-pressed', dimsOn); };
document.querySelectorAll('[data-view]').forEach(b=>b.onclick = ()=>goView(b.dataset.view));

function resize(){ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < 600 ? 58 : 45; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

build(fromHash()); applyNight(); goView('frente', true);
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  stepAnims(dt);
  if (camAnim){ camAnim.k = Math.min(1, camAnim.k + dt/1.1); const e = ease(camAnim.k);
    camera.position.lerpVectors(camAnim.from.p, camAnim.to.p, e); controls.target.lerpVectors(camAnim.from.t, camAnim.to.t, e); if (camAnim.k >= 1) camAnim = null; }
  if (!reduce){ const s = 1 + .12*Math.sin(now/380); ring.scale.set(s,s,1); }
  controls.update(); renderer.render(scene, camera); placeLabels();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
